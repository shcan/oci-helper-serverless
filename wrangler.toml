name = "oci-helper-serverless"
main = "dist/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "web-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 数据库：Deploy to Cloudflare 按钮会自动创建并绑定（按 database_name）。
# 若自行用 wrangler 部署，先执行：
#   npx wrangler d1 create oci-helper-serverless
# 再把返回的 database_id 填到下方 database_id（部署按钮会自动注入，无需手填）。
# 表结构由 Worker 首次请求时自动 CREATE TABLE IF NOT EXISTS，无需手动跑 migration。
[[d1_databases]]
binding = "DB"
database_name = "oci-helper-serverless"
database_id = "3a1f2524-3927-4677-ad85-6bf5f212d68e"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LOG_HUB"
class_name = "LogHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LogHub"]

[triggers]
crons = ["* * * * *"]
